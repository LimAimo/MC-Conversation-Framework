plugins {
	id 'fabric-loom' version '1.7.3'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html for more information about repositories.
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		mccf {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// ModMenu integration (optional): compile-only so MCCFModMenuIntegration can
	// reference ModMenu's API, but MCCF does NOT require players to have ModMenu
	// installed — see "suggests" in fabric.mod.json. Use modCompileOnly (not
	// modImplementation) so ModMenu is available at compile time without being
	// bundled/required at runtime or during development testing.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Gson is bundled with Minecraft, used here for config / dictionary serialization.

	// JUnit 5 for unit testing pure-logic classes (RateLimiter, cache, etc.)
	// Minecraft-dependent code (rendering, GUI, networking) is tested manually.
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
	// 1.1.6：给 jar 的 MANIFEST.MF 加 Main-Class，双击 jar 时 JVM 会调用
	// net.mccf.installer.JarDoubleClick.main()，弹一个安装提示窗口。
	// Fabric Loader 通过 fabric.mod.json 识别 mod，不看 Main-Class，
	// 所以不影响游戏内加载——玩家把 jar 放进 mods 文件夹后一切照常。
	manifest {
		attributes 'Main-Class': 'net.mccf.installer.JarDoubleClick'
	}
}

test {
	useJUnitPlatform()
}

// Loom 的分环境依赖不会自动进入普通 test；共享完整类路径才能测试使用 Gson/协议类型的逻辑。
// 测试仍不启动 Minecraft 客户端，纯逻辑 helper 也不访问游戏运行态。
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath + sourceSets.client.compileClasspath + sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
	}
}
